<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlubiny</title>
    <meta name="description" content="Personal website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="texture texture-screen" aria-hidden="true"></div>
    <div class="texture texture-ov1" aria-hidden="true"></div>
    <div class="texture texture-ov2" aria-hidden="true"></div>
    <div class="texture texture-ov3" aria-hidden="true"></div>
    <header class="site-header" role="banner">
      <div class="container header-inner">
        <div class="brand" aria-label="Top logo">
          <a href="#top" class="brand-link">HLUBINY</a>
        </div>
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="#about">About</a>
          <a class="nav-link" href="#creatures">Creatures</a>
          <a class="nav-link" href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <div id="bubbles-layer" aria-hidden="true"></div>

      <section id="about" class="section section-about" aria-labelledby="about-title">
        <div class="container">
          <h2 id="about-title">About</h2>
          <p>Intro copy placeholder. Replace with your content.</p>
        </div>
      </section>

      <section id="creatures" class="section section-creatures" aria-labelledby="creatures-title">
        <div class="container">
          <h2 id="creatures-title">Creatures</h2>
          <p>Space for animated creatures and visuals.</p>
        </div>
      </section>

      <section id="contact" class="section section-contact" aria-labelledby="contact-title">
        <div class="container">
          <h2 id="contact-title">Contact</h2>
          <p>Email placeholder: hi@hlubiny.example</p>
        </div>
      </section>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <div class="brand brand-footer" aria-label="Bottom logo">HLUBINY</div>
        <p>© <span id="year"></span> Hlubiny</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
  </html>
